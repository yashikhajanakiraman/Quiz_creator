<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzle</title>
  <link rel="stylesheet" href="myprofile.css" />
</head>
<body>
  <header>
    <div class="logo-container">
            <img class="h-logo" src="quizzle\images\quizzle-logo-2-bgless.png" alt="Logo">
            <span>Quizzle</span>
        </div>
        <div class="tab-container">
            <a href="#" class="active head-link">Home</a>
            <a href="about.html" class="head-link">About US</a>
            <a href="contact.html" class="head-link">Contact US</a>
            <a href="myprofile.html" class=head-link>My Profile</a>
        </div>
        <div class="login-container">
            <a href="#">LogIN / SignUP</a>
        </div>
  </header>

  <section class="profile-header">
    <div class="profile">
      <h1 id="username">Username</h1>
      <button class="edit-btn">Edit Profile</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat-card">
      <h2>Total Points</h2>
      <p id="totalPoints"></p>
    </div>
    <div class="stat-card">
      <h2>Quizzes Played</h2>
      <p id="quizzesPlayed"></p>
    </div>
    <div class="stat-card">
      <h2>Average Score</h2>
      <p id="avgScore"></p>
    </div>
    <div class="stat-card">
      <h2>Total Time</h2>
      <p id="timePlayed"></p>
    </div>
  </section>

  <section class="progress">
    <h2>Progress Level</h2>
    <div class="progress-bar">
      <div class="fill" style="width: 70%;"></div>
    </div>
  </section>

  <section class="badges">
    <h2>Achievements</h2>
    <div class="badge-container">
      <div class="badge">🏆 Top Scorer</div>
      <div class="badge">⚡ Fast Thinker</div>
      <div class="badge">🔥 Consistent Player</div>
    </div>
  </section>

  <section class="history">
    <h2>Quiz History</h2>
    <table>
      <thead>
        <tr>
          <th>Quiz</th>
          <th>Date</th>
          <th>Time Taken</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </section>

  <section class="actions">
    <button class="play-btn">Play New Quiz</button>
    <button class="leaderboard-btn">View Leaderboard</button>
  </section>
  <script type="module" src="my-profile.js"></script>
</body>
</html>
