<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard | Quizzle Celestius</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="Assets/Images/quizzle-logo-2-bgless.png">
  <link rel="stylesheet" href="myprofile.css" />
</head>
<body>
  <header>
    <div class="logo-container">
            <img class="h-logo" src="Assets/Images/quizzle-logo-2-bgless.png" alt="Logo">
            <span>Quizzle</span>
        </div>
        <div class="tab-container">
            <a href="index.html" class="head-link">Home</a>
            <a href="about-us.html" class="head-link">About US</a>
            <a href="contact.html" class="head-link">Contact US</a>
            <a href="myprofile.html" class=" active head-link">My Profile</a>
        </div>
        <div class="login-container">
            <a onclick="logOut()" href="#">Log Out</a>
        </div>
  </header>
  <hr>

  <section class="profile-header">
    <div class="profile">
      <h1 id="username">Username</h1>
      <a href="edit-profile.html"><button class="edit-btn">Edit Profile</button></a>
    </div>
  </section>
   <section class="actions">
    <a href="quiz-creator.html"><button class="play-btn">Create a New Quiz</button></a>
    <a href="quiz-editor.html"><button class="play-btn">Edit Your Quiz</button></a>
    <a href="quiz-deleter.html"><button class="play-btn">Delete Your Quiz</button></a>
    <a href="play-quiz.html"><button class="play-btn">Play a Quiz</button></a>
    <a style="grid-column: span 2;" href="instant-quizes.html"><button class="edit-btn">Play Instant Quizzes</button></a>
  </section>
  <section class="history">
    <h2>Your Quizzes</h2>
    <table>
      <thead>
        <tr style="animation: none;">
          <th>Quiz ID</th>
          <th>Quiz Name</th>
          <th>Mode</th>
          <th>Total Questions</th>
        </tr>
      </thead>
      <tbody id="tBody">
      </tbody>
    </table>
    <h3 id="notFound">No Quizzes Created</h3>
  </section>
  <script type="module" src="myprofile.js"></script>
</body>
</html>
