<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Quizzle Celestius</title>
    <meta name="description" content="Create a new account on Quizzle Celestius to build, play, and share custom quizzes. Developed by Chennai Institute of Technology (CIT) Celestius Tech Club.">
    <meta name="keywords" content="Sign Up, Quizzle Celestius, register account, quiz platform, CIT, Celestius Tech Club">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quizzle-celestius.netlify.app/sign-up.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quizzle-celestius.netlify.app/sign-up.html">
    <meta property="og:title" content="Sign Up | Quizzle Celestius">
    <meta property="og:description" content="Create a new account on Quizzle Celestius to build, play, and share custom quizzes.">
    <meta property="og:image" content="https://quizzle-celestius.netlify.app/Assets/Images/quizzle-logo-2-bgless.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://quizzle-celestius.netlify.app/sign-up.html">
    <meta property="twitter:title" content="Sign Up | Quizzle Celestius">
    <meta property="twitter:description" content="Create a new account on Quizzle Celestius to build, play, and share custom quizzes.">
    <meta property="twitter:image" content="https://quizzle-celestius.netlify.app/Assets/Images/quizzle-logo-2-bgless.png">

    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="sign-up.css">
    <link rel="icon" type="image/png" href="Assets/Images/quizzle-logo-2-bgless.png">
    <link rel="shortcut icon" type="image/png" href="Assets/Images/quizzle-logo-2-bgless.png">
    <link rel="apple-touch-icon" href="Assets/Images/quizzle-logo-2-bgless.png">
    <script src="https://kit.fontawesome.com/dc4390d531.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="gradient-sphere circle-1"></div>
    <div class="gradient-sphere circle-2"></div>
    <header>
        <div class="logo-container">
            <a href="index.html"><img class="h-logo" src="Assets/Images/quizzle-logo-2-bgless.png" alt="Logo"></a>
            <span>Quizzle</span>
        </div>
        <div class="tab-container">
            <a href="index.html" class="head-link">Home</a>
            <a href="about-us.html" class="head-link">About US</a>
            <a href="contact.html" class="head-link">Contact US</a>
        </div>
        <div class="login-container">
            <a id="dynBtn" href="login-page.html">LogIN</a>
        </div>
    </header>
    <hr>
    <div class="top-container">
        <div class="col">
            <img class="animate" id="signImg" src="Assets/Images/sign-up-wbg.gif" alt="Sign-up">
        </div>
        <div class="col-form" id="inputGetter">
            <h1>Sign Up on Quizzle Celestius</h1>
            <form action="">
                <div class="form-cont">
                    <div class="fld">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="fullName" placeholder="Name Goes Here..." required>
                    </div>
                    <div class="fld">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="userEmail" placeholder="Email Goes Here..." required>
                    </div>
                    <div class="dyn-btn">
                        <button onclick="proceedNow()" id="dynButton" href=""><span>Proceed &rarr;</span></button>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-form" id="passwordSetter" style="display: none;">
            <h1>Let's Set Your Password !</h1>
            <form id="psForm" action="">
                <div class="form-cont">
                    <div class="fld">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="pass1" placeholder="Password Goes Here..." required>
                    </div>
                    <div class="fld">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="pass2" placeholder="Again Here too..." required>
                    </div>
                    <div class="texter"><span class="status">Strong or Weak</span><span class="msg"> Password</span></div>
                    <div class="dyn-btn">
                        <button onclick="proceedCallMenu()" id="nxtButton" href=""><span>Proceed &rarr;</span></button>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-form" id="numberGetter" style="display: none;">
            <h1>Let's Add your Details !</h1>
            <form id="pForm" action="">
                <div class="form-cont" id="numberInputter">
                    <div class="fld">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" id="mobileNumb" placeholder="Mobile Number Goes Here..." required>
                    </div>
                    <div class="dyn-btn">
                        <button onclick="complete(true)" style="cursor: pointer;" id="skpButton" href=""><span>Skip &rarr;</span></button>
                        <button onclick="complete(false)" id="addButton" href=""><span>Complete SignUp &rarr;</span></button>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-form" id="conformator" style="display: none;">
            <h1 style="text-align: center;">You are Now a part of Quizzle Family !!</h1>
            <form id="cForm" action="">
                <div class="form-cont" id="numberInputter">
                    <h2 style="text-align: center; color: wheat;">Account Created Successuflly !<br> Now you can Login</h2>
                </div>
            </form>
            <div class="dyn-btn">
                <a href="login-page.html"><button style="background: linear-gradient(to bottom right, aquamarine,aqua); cursor: pointer;" id="logButton" href=""><span>Login &rarr;</span></button></a>
            </div>
        </div>
    </div>
    <hr>
    <script src="general.js"></script>
    <script type="module" src="sign-up.js"></script>
</body>
</html>
