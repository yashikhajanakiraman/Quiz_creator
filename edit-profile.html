<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="header.css">
    <link rel="icon" href="Assets/Images/quizzle-logo-2-bgless.png">
    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>
    <div class="gradient-sphere circle-1"></div>
    <div class="gradient-sphere circle-2"></div>
    <header>
        <div class="logo-container">
            <a href="index.html"><img class="h-logo" src="Assets/Images/quizzle-logo-2-bgless.png" alt="Logo"></a>
            <span>Quizzle</span>
        </div>
        <div class="tab-container">
            <a href="index.html" class="head-link">Home</a>
            <a href="about-us.html" class="head-link">About US</a>
            <a href="contact.html" class="head-link">Contact US</a>
        </div>
        <div class="login-container">
            <a id='dynBtn' href="login-page.html">LogIN / SignUP</a>
        </div>
    </header>
    <hr>
    <div class="top-container" id="topContainer">
        <h1>Edit Profile</h1>
        <div class="combi">
            <h2>User Full Name:</h2>
            <input type="text" name="" id="fName" placeholder="New Name Here...">
        </div>
        <div class="combi">
            <h2>User Email:</h2>
            <input type="text" name="" id="userEmail" placeholder="New Email Here...">
        </div>
        <div class="combi">
            <h2>User Mobile:</h2>
            <input type="text" name="" id="userMobile" placeholder="Add Mobile Number...">
        </div>
        <div class="combi">
            <h2>New Password:</h2>
            <input type="password" name="" id="newPassword" placeholder="Change Password Here...">
        </div>
        <div onclick="proceedToSave()" class="explore-btn">Save Details</div>
    </div>
    <script src="general.js"></script>
    <script src="edit-profile.js" type="module"></script>
</body>
</html>
