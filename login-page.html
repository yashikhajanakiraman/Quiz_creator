<body>
    <div class="gradient-sphere circle-1"></div>
    <div class="gradient-sphere circle-2"></div>

        <div class="logo-container">
            <a href="index.html"><img class="h-logo" src="Assets/Images/quizzle-logo-2-bgless.png" alt="Logo"></a>

        <div class="tab-container">

     <h3 style="margin-top: 4px;">Your One Stop Destination For Responsive Quizzes</h3>

    <div class="login-details">
        <h3>Login Details</h3>
        <div class="input-val">
            <input style="font-weight: bold;" type="email" id="userEmail" placeholder="👤 Email " required>

            <input style="font-weight: bold;" type="password" id="userPassword" placeholder="🛡️ Password " required>
        </div>
    </div>
    <div class="btn-cont">
        <button id="mybutton" onclick="logIn()">Sign In</button>
        <a href="sign-up.html"><button id="mybutton">Sign Up</button></a>
