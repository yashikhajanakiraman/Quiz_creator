<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-page.css">
    <link rel="icon" href="Assets/Images/quizzle-logo-2-bgless.png">
    <title>Login Page</title>
</head>
<body>
    <a href="home.html"><img src="Assets/Images/quizzle-logo-2-bgless.png" width="220px" height="170px"></a>
    <h1 style="color: goldenrod;">Quizzle</h1>
    <h3 style="margin-top: 4px;">Your One Stop Destination For Responsive Quizzes</h3>
    <br>
    <div class="login-details">
        <h3>Login Details</h3>
        <div class="input-val">
            <input type="email" id="userEmail" placeholder="👤 Email " required>
        </div>
        <div class="input-val">
            <input type="password" id="userPassword" placeholder="🛡️ Password " required>
        </div>
    </div>
    <div class="btn-cont">
        <button id="mybutton" onclick="logIn()">Sign In</button>
        <a href="sign-up.html"><button id="mybutton">Sign UP</button></a>
    </div>

    <script type="module" src="login-page.js"></script>

</body>
</html>
