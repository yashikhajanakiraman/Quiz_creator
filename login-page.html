<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-page.css">
    <link rel="icon" href="Assets/Images/quizzle-logo-2-bgless.png">
    <title>Login Page</title>
</head>
<body>
    <div class="gradient-sphere circle-1"></div>
    <div class="gradient-sphere circle-2"></div>
    <header>
        <div class="logo-container">
            <a href="index.html"><img class="h-logo" src="Assets/Images/quizzle-logo-2-bgless.png" alt="Logo"></a>
            <span>Quizzle</span>
        </div>
        <div class="tab-container">
            <a href="index.html" class="head-link">Home</a>
            <a href="about-us.html" class="head-link">About US</a>
            <a href="contact.html" class="head-link">Contact US</a>
        </div>
        <div class="login-container">
            <a href="#">LogIN / SignUP</a>
        </div>
    </header>
    <hr>
    <img src="Assets/Images/quizzle-logo-2-bgless.png" width="220px" height="170px">
    <h1 style="color: orange;">Quizzle</h1>
    <h3 style="margin-top: 4px;">Your One Stop Destination For Responsive Quizzes</h3>
    <br>
    <div class="login-details">
        <h3>Login Details</h3>
        <div class="input-val">
            <input style="font-weight: bold;" type="email" id="userEmail" placeholder="👤 Email " required>
        </div>
        <div class="input-val">
            <input style="font-weight: bold;" type="password" id="userPassword" placeholder="🛡️ Password " required>
        </div>
    </div>
    <div class="btn-cont">
        <button id="mybutton" onclick="logIn()">Sign In</button>
        <a href="sign-up.html"><button id="mybutton">Sign Up</button></a>
    </div>
    <script src="general.js"></script>
    <script type="module" src="login-page.js"></script>

</body>
</html>
